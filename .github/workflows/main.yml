name: Weekly Finance Crawler

on:
  schedule:
    - cron: "0 1 * * *"   # 天天timezone:  UTC 01:00 (台灣時間早上9點)
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run crawler
        run: python crawler.py

      - name: Commit results
        run: |
          git config --global user.name "LoChangCheng"
          git config --global user.email "610630112@gms.tku.edu.tw"
          git add data/finance.json
          git commit -m "update weekly finance data"
          git push origin main
