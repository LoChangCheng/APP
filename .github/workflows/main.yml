name: Market Data Crawler

on:
  # 允許你隨時在 GitHub 網頁上手動點擊 "Run workflow" 測試
  workflow_dispatch:
  # 未來如果要每天自動跑，可以把下面的註解拿掉 (例如台灣時間每天晚上 10 點)
  # schedule:
  #   - cron: "0 14 * * *"

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    # 【重要】允許 Action 將新抓下來的 CSV 檔 push 回你的 Repo
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: 🚀 Run crawler script
        run: python crawler.py

      - name: Commit results
        run: |
          git config --global user.name "LoChangCheng"
          git config --global user.email "610630112@gms.tku.edu.tw"
          git add data/finance.json
          
          # 檢查是否有檔案更動，避免沒有資料更新時報錯
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "update weekly finance data"
            
            # 👇 這是關鍵！一定要加這行把遠端進度拉下來
            git pull --rebase origin main
            
            # 然後再推上去
            git push origin main
          else
            echo "No changes to commit"
          fi
