name: Weekly Finance Crawler

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # 升級到 v4

      - name: Setup Python
        uses: actions/setup-python@v5  # 升級到 v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run crawler
        run: python crawler.py

      - name: Commit results
        run: |
          git config --global user.name "LoChangCheng"
          git config --global user.email "610630112@gms.tku.edu.tw"
          git add data/finance.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "update weekly finance data"
            git push origin main
          else
            echo "No changes to commit"
          fi
