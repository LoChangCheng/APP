name: Market Data Crawler

on:
  # 允許你隨時在 GitHub 網頁上手動點擊 "Run workflow" 測試
  workflow_dispatch:
  # 未來如果要每天自動跑，可以把下面的註解拿掉 (例如台灣時間每天晚上 10 點)
  # schedule:
  #   - cron: "0 14 * * *"

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    # 【重要】允許 Action 將新抓下來的 CSV 檔 push 回你的 Repo
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip' # 加入快取機制，讓以後安裝套件更快

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: 🚀 Run crawler script
        run: python crawler.py

      - name: 💾 Commit and Push changes
        run: |
          # 設定 Git 機器人身分
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 將 raw_market_data 資料夾內的所有變動加入追蹤
          git add raw_market_data/
          
          # 檢查是否有檔案變動，如果有才 commit，避免報錯
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "📊 每日市場數據更新: $(date +'%Y-%m-%d')"
            git push
          else
            echo "沒有新的數據需要更新。"
          fi
