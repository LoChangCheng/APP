name: Weekly Finance Crawler

on:
  schedule:
    - cron: "0 1 * * *"  # 每天 UTC 01:00 (台灣 09:00)
  workflow_dispatch:     # 允許手動觸發測試

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    # 增加寫入權限，確保能 push 回 Repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run crawler
        run: python crawler.py

      - name: Commit results
        run: |
          git config --global user.name "LoChangCheng"
          git config --global user.email "610630112@gms.tku.edu.tw"
          git add data/finance.json
          # 檢查是否有變更，避免空提交報錯
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update finance data: $(date +'%Y-%m-%d')"
            git push origin main
          else
            echo "No changes to commit"
          fi
