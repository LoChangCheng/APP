name: Market Data Crawler

on:
  # 允許你隨時在 GitHub 網頁上手動點擊 "Run workflow" 測試
  workflow_dispatch:
  # 未來如果要每天自動跑，可以把下面的註解拿掉 (例如台灣時間每天晚上 10 點)
  # schedule:
  #   - cron: "0 14 * * *"

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    # 【重要】允許 Action 將新抓下來的 CSV 檔 push 回你的 Repo
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 加入 requests 與 lxml (pandas 抓網頁表格會用到)
          pip install yfinance pandas requests lxml

      # 👇 加入這個新步驟，先產生台股清單
      - name: 📝 Update Tickers List
        run: python get_tw_tickers.py

      - name: 🚀 Run crawler script
        run: python crawler.py

      - name: 💾 Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 將 CSV 資料夾和清單檔案都加入追蹤
          git add raw_market_data/
          git add my_tickers.txt
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "📊 update daily market data and tickers"
            git pull --rebase origin main
            git push origin main
          else
            echo "沒有新的數據需要更新。"
          fi
