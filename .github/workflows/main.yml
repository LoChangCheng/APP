name: Test Risk Calculator

on:
  workflow_dispatch:

jobs:
  run-calculator:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 關鍵修改：必須把 yfinance 加回來
          pip install yfinance pandas numpy

      - name: 🧠 執行量化運算 (API 抓取計算 -> 產出 JSON)
        run: python calculate_risk.py

      - name: 💾 Commit 產出的 JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add risk_lookup.json
          
          if [ -n "$(git status --porcelain)" ]; then
            # 順便更新一下 commit 訊息，讓紀錄看起來更專業
            git commit -m "📊 更新：全市場風險指標 JSON (Bloomberg Beta升級版)"
            git pull --rebase origin main
            git push origin main
          else
            echo "沒有產出新的 JSON 檔案。"
          fi
