name: Market Data Crawler

on:
  # 允許你隨時在 GitHub 網頁上手動點擊 "Run workflow" 測試
  workflow_dispatch:
  # 未來如果要每天自動跑，可以把下面的註解拿掉 (例如台灣時間每天晚上 10 點)
  # schedule:
  #   - cron: "0 14 * * *"

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    # 【重要】允許 Action 將新抓下來的 CSV 檔 push 回你的 Repo
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: 🚀 Run crawler script
        run: python crawler.py

      - name: Commit results
        run: |
          git config --global user.name "LoChangCheng"
          git config --global user.email "610630112@gms.tku.edu.tw"
          
          # 👇 關鍵修正：把舊的 data/finance.json 改成追蹤新的資料夾
          git add raw_market_data/
          
          # 檢查是否有檔案更動
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "📊 update daily market data"
            
            # 先拉取遠端進度避免衝突
            git pull --rebase origin main
            
            # 推送上去
            git push origin main
          else
            echo "No changes to commit"
          fi
